name: Validar Beta 1.1 sem publicar
on:
  push:
    branches: [beta/1.1]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/check-export.ts
      - run: npm run build
        env:
          PAGES_BASE_PATH: /esports-manager
      - run: node scripts/check-export.ts
        env:
          PAGES_BASE_PATH: /esports-manager
