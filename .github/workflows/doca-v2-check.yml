name: Doca V2 and Beta 2.1 checks
on:
  push:
    branches: [codex/doca-v2-spatial, release/beta-2.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: PAGES_BASE_PATH=/esports-manager npm run build
      - run: PAGES_BASE_PATH=/esports-manager node scripts/check-export.ts
      - run: node scripts/check-candidate-export.ts
      - run: PAGES_BASE_PATH=/esports-manager node scripts/check-agent-art.ts --export
